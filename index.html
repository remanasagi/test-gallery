
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOOYOUNG'S GALLERY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f5f1ec;
  --paper: #fcfaf7;
  --text: #49423d;
  --muted: #968b80;
  --line: #ded5cc;
  --accent: #9a8270;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Gowun Batang', serif;
}

/* HEADER */

header {
  height: 72px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(252,250,247,.94);
  border-bottom: 1px solid var(--line);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 23px;
  letter-spacing: 2px;
}

nav {
  display: flex;
  gap: 35px;
}

nav a {
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  transition: .3s;
}

nav a:hover {
  color: var(--accent);
}

/* HERO */

.hero {
  min-height: 390px;
  display: flex;
  align-items: center;
  padding: 60px 9%;
  color: white;

  background:
    linear-gradient(90deg,
      rgba(65,54,48,.72),
      rgba(65,54,48,.12)),
    url('https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&w=2000&q=90')
    center 48% / cover;
}

.hero-content {
  max-width: 550px;
}

.eyebrow {
  font-family: 'Playfair Display', serif;
  letter-spacing: 4px;
  font-size: 13px;
  margin-bottom: 20px;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 6vw, 72px);
  font-weight: 400;
  line-height: 1.08;
  margin-bottom: 22px;
}

.hero p {
  font-size: 16px;
  margin-bottom: 28px;
  opacity: .9;
}

.hero button {
  padding: 12px 25px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 30px;
  color: white;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  transition: .3s;
}

.hero button:hover {
  background: white;
  color: var(--text);
}

/* COMMON */

.container {
  max-width: 1400px;
  margin: auto;
  padding: 65px 5%;
}

.section-heading {
  margin-bottom: 25px;
}

.section-heading .small-title {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-bottom: 8px;
}

.section-heading h2 {
  font-family: 'Playfair Display', serif;
  font-size: 34px;
  font-weight: 400;
}

.section-heading p {
  font-size: 14px;
  color: var(--muted);
  margin-top: 8px;
}

/* UPLOAD */

.upload-box {
  background: var(--paper);
  border: 1px dashed #c9bcb0;
  border-radius: 5px;
  padding: 38px 20px;
  text-align: center;
  transition: .3s;
}

.upload-box.dragover {
  background: #eee6dc;
  border-color: var(--accent);
}

.upload-icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.upload-box h3 {
  font-size: 17px;
  font-weight: 400;
  margin-bottom: 8px;
}

.upload-box p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

.upload-button {
  display: inline-block;
  padding: 11px 24px;
  background: var(--accent);
  color: white;
  font-size: 13px;
  cursor: pointer;
  transition: .3s;
}

.upload-button:hover {
  background: #776252;
}

#imageInput {
  display: none;
}

/* GALLERY */

.gallery-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 25px;
}

.photo-count {
  font-size: 13px;
  color: var(--muted);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.photo-card {
  background: var(--paper);
  overflow: hidden;
  border: 1px solid #e7dfd7;
  animation: appear .4s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.photo-card img {
  width: 100%;
  height: 280px;
  display: block;
  object-fit: cover;
  cursor: pointer;
  transition: transform .5s;
}

.photo-card:hover img {
  transform: scale(1.04);
}

.photo-info {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  gap: 10px;
}

.photo-name {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.delete-button {
  border: none;
  background: transparent;
  color: #a47d70;
  cursor: pointer;
  font-family: inherit;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 65px 20px;
  background: var(--paper);
  color: var(--muted);
  font-size: 14px;
}

/* LIGHTBOX */

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(30,25,22,.93);
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90%;
  max-height: 85vh;
  object-fit: contain;
}

.close-button {
  position: absolute;
  top: 25px;
  right: 35px;
  background: none;
  border: none;
  color: white;
  font-size: 38px;
  cursor: pointer;
}

/* FOOTER */

footer {
  border-top: 1px solid var(--line);
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 850px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }

  .photo-card img {
    height: 230px;
  }
}

@media (max-width: 550px) {
  header {
    padding: 0 18px;
  }

  .logo {
    font-size: 16px;
  }

  nav {
    gap: 12px;
  }

  nav a {
    font-size: 12px;
  }

  .hero {
    min-height: 330px;
    padding: 40px 7%;
  }

  .gallery {
    grid-template-columns: 1fr;
  }

  .photo-card img {
    height: 260px;
  }

  .container {
    padding: 45px 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JOOYOUNG'S GALLERY</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#upload">Upload</a>
  </nav>
</header>

<section class="hero" id="home">
  <div class="hero-content">
    <div class="eyebrow">PHOTO GALLERY</div>

    <h1>JOOYOUNG'S<br>GALLERY</h1>

    <p>소중한 순간들을 기록하는 작은 미술관 ♡</p>

    <button onclick="document.querySelector('#gallery').scrollIntoView()">
      갤러리 둘러보기 →
    </button>
  </div>
</section>

<main>

  <section class="container" id="upload">

    <div class="upload-box" id="uploadBox">
      <div class="upload-icon">♧</div>

      <h3>사진을 드래그하거나 선택해주세요</h3>

      <p>소중한 순간을 갤러리에 추가해보세요.</p>

      <label for="imageInput" class="upload-button">
        사진 선택하기 +
      </label>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        multiple
      >
    </div>

  </section>

  <section class="container" id="gallery" style="padding-top: 10px;">

    <div class="gallery-heading">
      <div class="section-heading">
        <div class="small-title">COLLECTION</div>
        <h2>My Gallery</h2>
        <p>주영의 소중한 기록들</p>
      </div>

      <div class="photo-count" id="photoCount">
        0개의 사진
      </div>
    </div>

    <div class="gallery" id="galleryGrid">
      <div class="empty">
        아직 등록된 사진이 없습니다.<br>
        첫 번째 작품을 전시해보세요.
      </div>
    </div>

  </section>

</main>

<div class="lightbox" id="lightbox">
  <button class="close-button" id="closeButton">&times;</button>
  <img id="lightboxImage" src="" alt="확대 사진">
</div>

<footer>
  MADE WITH ♡ BY JOOYOUNG
</footer>

<script>
const imageInput = document.getElementById('imageInput');
const uploadBox = document.getElementById('uploadBox');
const galleryGrid = document.getElementById('galleryGrid');
const photoCount = document.getElementById('photoCount');

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const closeButton = document.getElementById('closeButton');

let photos = [];

// 브라우저 저장소에서 사진 불러오기
function loadPhotos() {
  const savedPhotos = localStorage.getItem('jooyoungGallery');

  if (savedPhotos) {
    try {
      photos = JSON.parse(savedPhotos);
    } catch {
      photos = [];
    }
  }

  renderGallery();
}

// 사진 선택
imageInput.addEventListener('change', event => {
  addPhotos(event.target.files);
  imageInput.value = '';
});

// 사진 추가
function addPhotos(files) {
  Array.from(files).forEach(file => {

    if (!file.type.startsWith('image/')) {
      return;
    }

    const reader = new FileReader();

    reader.onload = event => {

      photos.unshift({
        id: Date.now() + Math.random(),
        name: file.name,
        src: event.target.result
      });

      savePhotos();
      renderGallery();
    };

    reader.readAsDataURL(file);
  });
}

// 사진 저장
function savePhotos() {
  try {
    localStorage.setItem(
      'jooyoungGallery',
      JSON.stringify(photos)
    );
  } catch {
    alert('브라우저 저장 공간이 부족합니다. 사진을 줄이거나 일부 삭제해주세요.');
  }
}

// 갤러리 화면 출력
function renderGallery() {

  galleryGrid.innerHTML = '';

  photoCount.textContent = `${photos.length}개의 사진`;

  if (photos.length === 0) {
    galleryGrid.innerHTML = `
      <div class="empty">
        아직 등록된 사진이 없습니다.<br>
        첫 번째 작품을 전시해보세요.
      </div>
    `;
    return;
  }

  photos.forEach(photo => {

    const card = document.createElement('article');
    card.className = 'photo-card';

    const img = document.createElement('img');
    img.src = photo.src;
    img.alt = photo.name;

    img.addEventListener('click', () => {
      lightboxImage.src = photo.src;
      lightbox.classList.add('active');
    });

    const info = document.createElement('div');
    info.className = 'photo-info';

    const name = document.createElement('span');
    name.className = 'photo-name';
    name.textContent = photo.name;

    const deleteButton = document.createElement('button');
    deleteButton.className = 'delete-button';
    deleteButton.textContent = '삭제';

    deleteButton.addEventListener('click', () => {
      deletePhoto(photo.id);
    });

    info.append(name, deleteButton);
    card.append(img, info);

    galleryGrid.appendChild(card);
  });
}

// 사진 삭제
function deletePhoto(id) {

  if (!confirm('이 사진을 삭제할까요?')) {
    return;
  }

  photos = photos.filter(photo => photo.id !== id);

  savePhotos();
  renderGallery();
}

// 드래그 앤 드롭
uploadBox.addEventListener('dragover', event => {
  event.preventDefault();
  uploadBox.classList.add('dragover');
});

uploadBox.addEventListener('dragleave', () => {
  uploadBox.classList.remove('dragover');
});

uploadBox.addEventListener('drop', event => {
  event.preventDefault();
  uploadBox.classList.remove('dragover');

  addPhotos(event.dataTransfer.files);
});

// 사진 크게 보기 닫기
closeButton.addEventListener('click', () => {
  lightbox.classList.remove('active');
});

lightbox.addEventListener('click', event => {
  if (event.target === lightbox) {
    lightbox.classList.remove('active');
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    lightbox.classList.remove('active');
  }
});

// 처음 실행
loadPhotos();
</script>

</body>
</html>
